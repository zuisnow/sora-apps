<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>脳と医工学</title>
<meta name="theme-color" content="#0b1120">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="脳と医工学">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Reading room for brain-tech news: navy ground shared with sora apps, serif English headlines, one colour per field. Single dark look. */
:root{--bg:#0b1120;--panel:#111a2b;--line:#1f2b44;--line2:#2a3956;--ink:#edf1f7;--sub:#8c9cb6;--dim:#5d6b84;--accent:#7aa7ff;
  --bci:#7aa7ff;--stim:#f0a35e;--imaging:#5fc9b8;--rehab:#c48cf0;--device:#d9c95f;--ai:#ef7f9a;--paper:#a9b6c9;
  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;--en:"Source Serif 4","Iowan Old Style",Georgia,serif;--num:"Barlow Condensed","Arial Narrow",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--jp);font-size:15px;line-height:1.55;font-weight:500;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:#070c18}
#app{max-width:720px;margin:0 auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#070c18;border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.hd h1{margin:0;font-size:19px;font-weight:900;letter-spacing:.06em;white-space:nowrap}
.trace{flex:1;min-width:40px;height:22px;opacity:.8}
.trace path{fill:none;stroke:var(--accent);stroke-width:1.4;vector-effect:non-scaling-stroke}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:4px;border:1px solid var(--line2);background:transparent;color:var(--ink);cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn:focus-visible,.chip:focus-visible,.tab:focus-visible,.bm:focus-visible,a:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:18px;padding-block:0}
.tab{background:none;border:0;color:var(--dim);font:inherit;font-weight:700;font-size:14px;padding:6px 0 9px;cursor:pointer;letter-spacing:.08em;box-shadow:inset 0 -2px 0 transparent}
.tab.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tab .n{font-family:var(--num);font-size:14px;color:var(--sub);margin-left:4px}
.meta-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--sub);padding-block:8px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--sub);cursor:pointer;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--sub))}
.chip b{font-family:var(--num);font-weight:600;font-size:13px;color:var(--dim)}
.chip.on{color:var(--ink);border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--panel))}
.search{display:flex;gap:8px;padding-bottom:12px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border-radius:4px;border:1px solid var(--line2);background:#0a101d;color:var(--ink)}
.day{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.14em;padding-block:18px 6px;border-bottom:1px solid var(--line)}
.day b{font-family:var(--num);font-size:15px;color:var(--ink);letter-spacing:.04em;margin-right:8px}
article{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding-block:14px;border-bottom:1px solid var(--line)}
article.read .ttl{color:#b5c0d2}
.meta{grid-column:1/-1;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--sub)}
.meta .src{color:var(--ink);font-weight:700}
.meta .time{font-family:var(--num);font-size:13px}
.kind{font-size:10.5px;font-weight:900;letter-spacing:.1em;padding:1px 6px;border:1px solid var(--paper);color:var(--paper);border-radius:2px}
.body{min-width:0}
.ttl{font-family:var(--en);font-size:17px;line-height:1.38;font-weight:600;color:var(--ink);text-decoration:none;display:block;text-wrap:pretty}
.ttl.ja{font-family:var(--jp);font-weight:700;font-size:16px}
.tj{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.snip{font-size:13px;color:var(--dim);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px}
.tag{font-size:11.5px;font-weight:700;color:var(--c);display:inline-flex;align-items:center;gap:5px}.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.thumb{width:76px;height:76px;object-fit:cover;border-radius:3px;background:var(--panel);display:block}
.bm{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;color:var(--dim);cursor:pointer;border-radius:4px}
.bm svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.bm.on{color:var(--accent)}.bm.on svg{fill:currentColor}
.empty{padding:40px 0;text-align:center;color:var(--sub)}
.panel{background:var(--panel);border-top:1px solid var(--line2);padding:16px;margin-top:14px}
.panel h2{font-size:15px;margin:0 0 10px;font-weight:900;display:flex;align-items:center;gap:8px}.panel h2::before{content:"";width:4px;height:15px;background:var(--accent)}
.panel ol{margin:6px 0 0;padding-left:20px;font-size:13.5px;color:var(--sub)}.panel li{margin:4px 0}
.lbl{display:block;font-size:12px;color:var(--sub);margin:14px 0 6px;letter-spacing:.08em}
.inp{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:4px;border:1px solid var(--line2);background:#0a101d;color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:14px}.chk input{width:18px;height:18px;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:14px;font-weight:700;padding:10px 16px;border-radius:4px;border:1px solid var(--line2);background:#16223a;color:var(--ink);cursor:pointer;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#08101f}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.msg{font-size:13px;margin-top:10px;color:var(--sub)}.msg.bad{color:#ef6b5f}
.src-list{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.src-list td{padding:6px 4px;border-bottom:1px solid var(--line)}.src-list td.r{text-align:right;font-family:var(--num);font-size:14px}
.ok{color:#58c487}.ng{color:#ef6b5f}
.sample{font-size:11px;font-weight:900;letter-spacing:.1em;color:#1a1206;background:#e5b53a;padding:1px 6px;border-radius:2px}
.more{display:block;margin:18px auto 0}
@media (prefers-reduced-motion:reduce){.iconbtn.spin svg{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
