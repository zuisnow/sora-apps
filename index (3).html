<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>sora apps</title>
<meta name="theme-color" content="#0b1120">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;900&display=swap">
<style>
:root{--bg:#0b1120;--panel:#121b2d;--line:#24324d;--ink:#eef2f8;--sub:#8b9bb5;--accent:#2257b8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:500}
main{max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
h1{font-size:22px;font-weight:900;letter-spacing:.08em;margin:0 0 20px;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:5px;height:22px;background:var(--accent)}
a.app,div.app{display:flex;align-items:center;gap:14px;padding:14px;background:var(--panel);border-top:1px solid var(--line);margin-bottom:8px;color:inherit;text-decoration:none}
a.app:focus-visible{outline:2px solid #e5b53a;outline-offset:2px}
.app img{width:52px;height:52px;image-rendering:pixelated;flex:none}
.app .ph{width:52px;height:52px;background:#18243b;flex:none}
.app b{display:block;font-weight:900;font-size:16px}.app span{font-size:12.5px;color:var(--sub)}
div.app{opacity:.55}
</style>
</head>
<body>
<main>
<h1>sora apps</h1>
<a class="app" href="ekiden/"><img src="ekiden/icon-192.png" alt=""><div><b>駅伝監督</b><span>大学駅伝の監督シミュレーション</span></div></a>
<a class="app" href="news/"><img src="news/icon-192.png" alt=""><div><b>脳と医工学</b><span>BCI・神経刺激・脳計測のニュースと論文</span></div></a>
<div class="app"><div class="ph"></div><div><b>Trail Blazers</b><span>準備中</span></div></div>
</main>
</body>
</html>
